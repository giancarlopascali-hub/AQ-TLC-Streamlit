name: Verify desktop application

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Audit Python dependencies
        run: python -m pip install pip-audit && python -m pip_audit -r requirements.txt
      - name: Check Python modules
        run: python -m py_compile streamlit_app.py tlc_backend.py
      - name: Run Python tests
        run: python -m pytest -q tests/test_tlc_backend.py
      - name: Check JavaScript modules
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend -type f -name '*.js' -print0)
      - name: Run JavaScript contract tests
        run: node tests/javascript/analysis.test.mjs
      - name: Scan tracked source for high-risk secret patterns
        shell: bash
        run: |
          if git grep -nI -E -e '-----BEGIN [A-Z ]*PRIVATE KEY-----|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}' -- ':!tests/fixtures'; then
            echo "Potential secret material found. Remove it and use deployment secrets instead."
            exit 1
          fi
